name: release-readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.STUDIO_AWS_REGION || 'us-west-2' }}
      MODEL_BUNDLE_URI: ${{ vars.DAJOONG_MODEL_BUNDLE_S3_URI }}
      MODEL_BUNDLE_SHA256: ${{ secrets.DAJOONG_MODEL_BUNDLE_SHA256 }}
      VITE_STUDIO_API_URL: https://studio-api.dajoongbim.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ANDROID_APP_LINK_SHA256: ${{ vars.ANDROID_APP_LINK_SHA256 }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      APPLE_SERVICE_ID: ${{ secrets.APPLE_SERVICE_ID }}
      APPLE_SIGN_IN_KEY_ID: ${{ secrets.APPLE_SIGN_IN_KEY_ID }}
      APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
      KAKAO_OIDC_CLIENT_ID: ${{ secrets.KAKAO_OIDC_CLIENT_ID }}
      KAKAO_OIDC_CLIENT_SECRET: ${{ secrets.KAKAO_OIDC_CLIENT_SECRET }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TOSS_SECRET_KEY: ${{ secrets.TOSS_SECRET_KEY }}
      TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
      APP_REVIEW_DEMO_USER: ${{ secrets.APP_REVIEW_DEMO_USER }}
      APP_REVIEW_DEMO_PASSWORD: ${{ secrets.APP_REVIEW_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the initial production release keys
        shell: bash
        run: |
          set -euo pipefail
          export AWS_DEPLOY_ROLE_ARN='${{ vars.AWS_DEPLOY_ROLE_ARN }}'
          for name in AWS_DEPLOY_ROLE_ARN MODEL_BUNDLE_URI MODEL_BUNDLE_SHA256 CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            test -n "${!name:-}" || { echo "Missing production setting: $name" >&2; exit 1; }
          done
          if ! { test -n "${STRIPE_SECRET_KEY:-}" && test -n "${STRIPE_WEBHOOK_SECRET:-}"; } \
            && ! { test -n "${TOSS_CLIENT_KEY:-}" && test -n "${TOSS_SECRET_KEY:-}"; }; then
            echo "Configure a complete Stripe or Toss Payments live-key pair" >&2
            exit 1
          fi
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verified private checkpoints
        shell: bash
        run: |
          set -euo pipefail
          aws s3 cp "$MODEL_BUNDLE_URI" "$RUNNER_TEMP/private-models.tar.gz" --only-show-errors
          python scripts/install_private_models.py "$RUNNER_TEMP/private-models.tar.gz" \
            modules/plan2bim/src/buili_plan2bim/models --sha256 "$MODEL_BUNDLE_SHA256"
      - run: python -m pip install -e "modules/plan2bim[dev]" -e "apps/plan2bim-studio/backend[dev,aws,auth]"
      - run: python -m pytest modules/plan2bim/tests apps/plan2bim-studio/backend/tests -q
      - run: docker build -f apps/plan2bim-studio/backend/Dockerfile .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/plan2bim-studio/frontend/package-lock.json
      - run: npm ci
        working-directory: apps/plan2bim-studio/frontend
      - run: npm run links:prepare && npm test && npm run build && npm run store:validate
        working-directory: apps/plan2bim-studio/frontend
      - name: Remove private model material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/private-models.tar.gz"
          find modules/plan2bim/src/buili_plan2bim/models -maxdepth 1 -type f \
            ! -name '__init__.py' ! -name 'ACTIVE_RUNTIME.json' -delete
